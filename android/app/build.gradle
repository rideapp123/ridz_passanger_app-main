plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file(System.getenv("ANDROID_KEY_PROPERTIES") ?: "key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def signingValue = { env, key -> System.getenv(env) ?: keystoreProperties[key] }
def dartDefines = [:]
if (project.hasProperty("dart-defines")) {
    project.property("dart-defines").split(",").each { encoded ->
        def pair = new String(encoded.decodeBase64(), "UTF-8").split("=", 2)
        dartDefines[pair[0]] = pair.length == 2 ? pair[1] : ""
    }
}

android {
    namespace = "com.ridzs.passenger"
    compileSdk 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ridzs.passenger"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }
    signingConfigs {
        release {
            keyAlias signingValue("ANDROID_KEY_ALIAS", "keyAlias")
            keyPassword signingValue("ANDROID_KEY_PASSWORD", "keyPassword")
            def store = signingValue("ANDROID_KEYSTORE_PATH", "storeFile")
            storeFile store ? file(store) : null
            storePassword signingValue("ANDROID_KEYSTORE_PASSWORD", "storePassword")
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug{
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    flavorDimensions "environment"
    productFlavors {
        local {
            dimension "environment"
            applicationIdSuffix ".local"
            resValue "string", "app_name", "Ridzs Local"
            manifestPlaceholders = [
                cleartextTraffic: "true",
                mapsApiKey: dartDefines["GOOGLE_MAPS_ANDROID_API_KEY"] ?: "",
                paymentScheme: "com.ridzs.passenger.local.payments",
                admobAppId: dartDefines["ADMOB_ANDROID_APP_ID"] ?: ""
            ]
        }
        demo {
            dimension "environment"
            applicationIdSuffix ".demo"
            resValue "string", "app_name", "Ridzs Demo"
            manifestPlaceholders = [
                cleartextTraffic: "false",
                mapsApiKey: dartDefines["GOOGLE_MAPS_ANDROID_API_KEY"] ?: "",
                paymentScheme: "com.ridzs.passenger.demo.payments",
                admobAppId: dartDefines["ADMOB_ANDROID_APP_ID"] ?: ""
            ]
        }
        prod {
            dimension "environment"
            resValue "string", "app_name", "Ridzs"
            manifestPlaceholders = [
                cleartextTraffic: "false",
                mapsApiKey: dartDefines["GOOGLE_MAPS_ANDROID_API_KEY"] ?: "",
                paymentScheme: "com.ridzs.passenger.payments",
                admobAppId: dartDefines["ADMOB_ANDROID_APP_ID"] ?: ""
            ]
        }

    }
}

flutter {
    source = "../.."
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.7.0'
    implementation 'com.google.android.gms:play-services-wallet:19.1.0'
    implementation 'com.stripe:stripe-android:20.21.0'
    androidTestImplementation 'androidx.test:runner:1.2.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}

gradle.taskGraph.whenReady { graph ->
    def allowedFlavor = keystoreProperties["allowedFlavor"]
    if (allowedFlavor && graph.allTasks.any {
        it.project == project && it.name.toLowerCase().contains("release") &&
        (it.name.toLowerCase().contains("prod") || it.name.toLowerCase().contains("local"))
    }) {
        throw new GradleException("This keystore is restricted to demo builds")
    }
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains("release") }) {
        ["ANDROID_KEY_ALIAS": "keyAlias", "ANDROID_KEY_PASSWORD": "keyPassword",
         "ANDROID_KEYSTORE_PASSWORD": "storePassword", "ANDROID_KEYSTORE_PATH": "storeFile"].each { env, key ->
            if (!signingValue(env, key)) throw new GradleException("Release signing requires " + env + " or key.properties " + key)
        }
    }
}
